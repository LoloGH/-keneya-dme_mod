# ---------------------------------------------------------------------------
# Keneya-DME — VirtualHost Apache
#
# Installation (Debian/Ubuntu) :
#   sudo cp deploy/apache/keneya-dme.conf /etc/apache2/sites-available/
#   sudo a2enmod rewrite headers deflate expires
#   sudo a2ensite keneya-dme
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Installation (RHEL/Rocky) : déposer dans /etc/httpd/conf.d/
#
# Adapter ServerName et le chemin d'installation avant mise en service.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName dme.example.org

    # En production, rediriger vers HTTPS et servir le site depuis le
    # bloc :443 ci-dessous.
    # Redirect permanent / https://dme.example.org/

    # La racine pointe sur public/ : c'est la règle de sécurité
    # fondamentale. Aucun autre répertoire de l'application ne doit être
    # atteignable par une URL.
    DocumentRoot /var/www/keneya-dme/public

    <Directory /var/www/keneya-dme/public>
        # AllowOverride All laisse le .htaccess livré piloter la
        # réécriture. Pour de meilleures performances, passer à None et
        # décommenter les règles RewriteRule ci-dessous.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks

        # <IfModule mod_rewrite.c>
        #     RewriteEngine On
        #     RewriteCond %{REQUEST_FILENAME} !-d
        #     RewriteCond %{REQUEST_FILENAME} !-f
        #     RewriteRule ^ index.php [L]
        # </IfModule>
    </Directory>

    # Interdiction explicite d'accès au reste de l'installation, au cas
    # où un lien symbolique ou une erreur de configuration exposerait un
    # de ces répertoires.
    <DirectoryMatch "^/var/www/keneya-dme/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # Fichiers sensibles, quel que soit leur emplacement.
    <FilesMatch "^\.(env|git|htaccess)|composer\.(json|lock)$|package(-lock)?\.json$|\.sqlite$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        # Un dossier médical ne doit jamais être indexé ni encadré.
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Header unset X-Powered-By
        # Décommenter une fois le HTTPS en place :
        # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # PHP-FPM. Adapter la version de la socket à celle installée.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # La génération de PDF volumineux peut dépasser le défaut.
    <IfModule mod_proxy_fcgi.c>
        ProxyTimeout 120
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
                                      application/javascript application/json \
                                      image/svg+xml
    </IfModule>

    # Les assets Vite portent une empreinte dans leur nom : ils sont
    # immuables et peuvent être mis en cache indéfiniment.
    <IfModule mod_expires.c>
        ExpiresActive On
        <LocationMatch "^/build/">
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "immutable"
        </LocationMatch>
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/keneya-dme-error.log
    CustomLog ${APACHE_LOG_DIR}/keneya-dme-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS — à activer en production (obligatoire pour des données de santé)
# ---------------------------------------------------------------------------
