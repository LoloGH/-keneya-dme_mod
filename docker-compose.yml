# Stack de déploiement Keneya-DME.
#
#   Internet → Nginx → PHP-FPM → MySQL
#                        │
#                        ├── worker de file (SMS, notifications)
#                        └── planificateur (suivi d'acheminement SMS)
#
# Démarrage :
#   cp .env.docker.example .env
#   docker compose up -d --build
#   → http://localhost:8080
#
# Aucun secret n'est écrit dans ce fichier : tout provient de .env.

services:

  # -------------------------------------------------------------------
  # Application — PHP-FPM
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      target: app
    image: keneya-dme:latest
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
    env_file:
      - .env
    volumes:
      # Seules les données produites en exploitation sont persistées.
      # Le code vient de l'image, jamais de l'hôte.
      - documents:/var/www/html/storage/app/private
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keneya

  # -------------------------------------------------------------------
  # Serveur web
  # -------------------------------------------------------------------
  web:
    build:
      context: .
      target: web
    image: keneya-dme-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - app
    networks:
      - keneya

  # -------------------------------------------------------------------
  # Worker de file — SMS et notifications
  # -------------------------------------------------------------------
  queue:
    build:
      context: .
      target: app
    image: keneya-dme:latest
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
    env_file:
      - .env
    command: >
      php artisan queue:work
        --queue=sms,default
        --tries=3
        --backoff=60
        --max-time=3600
        --sleep=3
    volumes:
      - documents:/var/www/html/storage/app/private
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    # L'image « app » embarque un HEALTHCHECK qui interroge PHP-FPM sur le
    # port 9000. Ce worker ne lance pas PHP-FPM (sa commande le remplace
    # par `queue:work`) : hériter ce contrôle le ferait échouer en
    # permanence et marquerait le conteneur « unhealthy » à tort.
    healthcheck:
      disable: true
    networks:
      - keneya

  # -------------------------------------------------------------------
  # Planificateur — suivi d'acheminement des SMS, purges
  # -------------------------------------------------------------------
  scheduler:
    build:
      context: .
      target: app
    image: keneya-dme:latest
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - documents:/var/www/html/storage/app/private
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    # Même raison que pour le worker de file : ce conteneur ne fait pas
    # tourner PHP-FPM, le healthcheck de l'image ne s'y applique pas.
    healthcheck:
      disable: true
    networks:
      - keneya

  # -------------------------------------------------------------------
  # Base de données
  # -------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-keneya_dme}"
      MYSQL_USER: "${DB_USERNAME:-keneya}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD doit être défini dans .env}"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - keneya

volumes:
  database:
  documents:
  logs:

networks:
  keneya:
    driver: bridge
