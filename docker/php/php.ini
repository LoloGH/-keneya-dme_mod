; Configuration PHP de production pour Keneya-DME.
; Les valeurs sont dimensionnées pour l'import de documents médicaux
; (imagerie, comptes rendus scannés) et la génération de PDF.

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Doit rester cohérent avec keneya.documents.max_size_kb (20 Mo).
upload_max_filesize = 24M
post_max_size = 32M
max_file_uploads = 20

; Un dossier médical ne doit jamais exposer de trace technique.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

date.timezone = UTC

; OPcache — obligatoire en production.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Sessions : le durcissement applicatif est fait par Laravel, ceci en
; est le filet de sécurité au niveau du moteur.
session.cookie_httponly = 1
session.use_strict_mode = 1
