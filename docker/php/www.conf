; Pool PHP-FPM de Keneya-DME.
[www]
user = www-data
group = www-data

; Adresse explicite : « listen = 9000 » fait d'abord tenter [::] , ce qui
; échoue avec un avertissement sur les hôtes Docker sans IPv6.
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Processus dynamiques : adapté à un établissement de taille moyenne.
; Ajuster pm.max_children selon la mémoire disponible (≈ 64 Mo/processus).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Endpoint interrogé par le healthcheck du conteneur.
ping.path = /ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
