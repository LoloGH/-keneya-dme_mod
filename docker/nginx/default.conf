# Serveur applicatif Keneya-DME.
#
# La racine pointe sur public/ : aucun fichier de l'application
# (.env, storage/, vendor/, database/) n'est atteignable par une URL.

server {
    # Pas d'écoute IPv6 explicite : le réseau bridge par défaut de Docker
    # n'active pas IPv6, et « listen [::] » y fait échouer le démarrage.
    # L'hôte publie le port ; c'est lui qui décide de la famille d'adresses.
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Doit rester cohérent avec upload_max_filesize côté PHP.
    client_max_body_size 32M;

    # En-têtes de sécurité. Un dossier médical ne doit jamais être
    # indexé, ni affichable dans une iframe tierce.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression des réponses textuelles.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets compilés par Vite : immuables, empreinte dans le nom.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # La génération de PDF volumineux peut dépasser le défaut de 60 s.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Refus explicite de tout fichier caché (.env, .git, .htaccess…).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Aucun fichier PHP ne doit être exécuté depuis un dossier de dépôt.
    location ~* ^/(storage|vendor|database|bootstrap)/.*\.php$ {
        deny all;
    }
}
